name: PR Validate

# PR 상태에서 빌드가 한 번도 돌지 않아 Dependabot PR이 무검증으로 열려 있던 구조를 닫는다.
# 배포는 하지 않는다. 검증만 하고 끝낸다 — 배포는 main push 시 deploy-pages.yml이 담당.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Build site
        run: npm run build
        env:
          VITE_BASE_PATH: /dev-studio/

      # 회의록 JSON이 dist에 실제로 실렸는지 확인한다.
      # 2026-08-18~08-24 라이브 저널 404 사고가 이 단계 부재에서 나왔다.
      - name: Verify journal artifact
        run: |
          JOURNAL=dist/data/operations-journal.json
          if [ ! -f "$JOURNAL" ]; then
            echo "::error::$JOURNAL 이 빌드 산출물에 없다"
            exit 1
          fi
          SIZE=$(wc -c < "$JOURNAL")
          ENTRIES=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$JOURNAL','utf8')).length)")
          if [ "$ENTRIES" -lt 1 ]; then
            echo "::error::회의록 엔트리가 0건이다"
            exit 1
          fi
          {
            echo "### ✅ PR 검증 통과"
            echo ""
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 회의록 크기 | ${SIZE} B |"
            echo "| 회의록 엔트리 | ${ENTRIES} 건 |"
          } >> "$GITHUB_STEP_SUMMARY"
