name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sha:
        description: '배포할 커밋 SHA (비우면 트리거 시점의 기본 SHA)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # dispatch로 넘어온 SHA를 우선 사용한다. push 이벤트에서는 inputs가 비어 github.sha로 폴백한다.
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Record deployed commit
        run: |
          {
            echo "### 📦 배포 대상 커밋"
            echo ""
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| SHA | \`$(git rev-parse HEAD)\` |"
            echo "| 커밋 | $(git log -1 --pretty=%s) |"
            echo "| 커밋 시각 | $(git log -1 --pretty=%cI) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          VITE_BASE_PATH: /dev-studio/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Health check deployed site
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          journal_url="${url%/}/data/operations-journal.json"
          echo "Health-checking deployed site: $url"
          code="000"
          journal_code="000"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" || true)
            code=${code:-000}
            if [ "$code" = "200" ]; then
              # 루트 200만으로는 부족하다. 회의록 원본이 빠진 채 배포돼도 홈은 200을 주고,
              # 방문자만 빈 저널을 본다. 데이터 파일까지 확인해야 그 사고가 초록불을 통과하지 못한다.
              # 단 404를 첫 시도에서 바로 실패로 굳히지 않는다 — Pages CDN 전파가 파일별로
              # 어긋날 수 있어 재시도 루프 안에서 함께 기다린다(8/24 회의 자율 수정).
              journal_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$journal_url" || true)
              journal_code=${journal_code:-000}
              if [ "$journal_code" = "200" ]; then
                echo "Site is live (HTTP 200) on attempt $i, journal data OK"
                {
                  echo "### ✅ 배포 헬스체크 통과"
                  echo ""
                  echo "| 항목 | 값 |"
                  echo "| --- | --- |"
                  echo "| 배포 URL | $url |"
                  echo "| 최종 HTTP 상태 | $code |"
                  echo "| 회의록 데이터 | HTTP $journal_code |"
                  echo "| 소요 시도 | $i / 5 |"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "Attempt $i: root HTTP 200 but journal HTTP $journal_code - retrying in 15s"
            else
              echo "Attempt $i: HTTP $code - retrying in 15s (Pages propagation delay)"
            fi
            sleep 15
          done
          echo "Health check failed after 5 attempts (root HTTP $code, journal HTTP $journal_code)"
          {
            echo "### ❌ 배포 헬스체크 실패"
            echo ""
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 배포 URL | $url (HTTP $code) |"
            echo "| 회의록 URL | $journal_url (HTTP $journal_code) |"
            echo "| 소요 시도 | 5 / 5 (초과) |"
            echo ""
            echo "회의록이 404면 \`public/data/\`가 커밋되지 않았을 가능성이 높다. \`git add public/data/\` 확인 필요."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
